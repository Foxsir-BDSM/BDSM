# ============================================================
# cloudflare/wrangler.toml —— 任务与媒体后端的部署配置
# ============================================================
# 部署步骤见同目录 README.md
# ============================================================

name = "foxsir-task-api"
main = "worker.js"
compatibility_date = "2026-01-01"

# ── 环境变量（非密钥）─────────────────────────────────────
[vars]
# 内容仓库定位（必须与前端 content-types.js 的 CONTENT_STORE 一致）
CONTENT_OWNER  = "Foxsir-BDSM"
CONTENT_REPO   = "foxsir-content"
CONTENT_DIR    = "posts"
CONTENT_BRANCH = "content"
# 历史沿革：
#   · 原始内容在 tasks 分支的 tasks/ 与 knowledge 分支的 articles/（旧格式）
#   · 2026-10-04 迁移：新建 content 分支，9 篇旧内容转新格式写入 posts/
#   · 仓库默认分支是 knowledge；main 分支只有一个 README
#   ★ 若将来改分支，需同时改这里与 content-types.js 的 CONTENT_STORE.branch

# R2 公开访问地址（绑定自定义域名后填，例如 https://media.foxsir.top）
# 留空时上传可用，但返回的 url 为空，前端拿不到地址。
R2_PUBLIC_BASE = ""

# ── D1 数据库 ─────────────────────────────────────────────
# 执行 `wrangler d1 create foxsir` 后，把输出的 database_id 填到这里
[[d1_databases]]
binding = "DB"
database_name = "foxsir"
database_id = "9128e7ae-d82a-4103-9151-9361b6d21d91"

# ── R2 存储桶 ─────────────────────────────────────────────
# 执行 `wrangler r2 bucket create foxsir-media` 后即可用
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "foxsir-media"

# ── 观察日志 ──────────────────────────────────────────────
[observability]
enabled = true
