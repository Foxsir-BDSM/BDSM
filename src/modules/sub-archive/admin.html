<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="../../shared/assets/images/OIP-C.jpg" type="image/jpeg" />
    <title>下位者档案馆 · 管理后台</title>
    <link rel="stylesheet" href="./css/global.css" />
    <link rel="stylesheet" href="./css/admin.css" />
  </head>
  <body>
    <!-- 顶部导航 -->
    <header class="admin-header">
      <h1>
        <img
          src="../../shared/assets/images/OIP-C.jpg"
          alt="Foxsir"
          style="height: 32px; vertical-align: middle; margin-right: 8px; border-radius: 4px"
        />
        下位者档案馆 · 管理后台
      </h1>
      <div id="userInfo">
        <span id="userEmail"></span>
        <span id="userRole"></span>
        <button id="logoutBtn">退出</button>
      </div>
    </header>

    <!-- 管理面板（登录后显示，权限不足时会替换内容） -->
    <div id="adminPanel" style="display: none; padding: 2rem">
      <div class="toolbar">
        <span>共 <span id="totalCount">0</span> 条档案</span>
        <input type="text" id="searchInput" placeholder="按姓名搜索…" />
      </div>
      <div id="recordsTableContainer">
        <!-- 动态渲染表格 -->
      </div>
    </div>

    <!-- 动态渲染表格 -->
    <script type="importmap">
      {
        "imports": {
          "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2"
        }
      }
    </script>

    <script type="module" src="./js/admin.js"></script>
  </body>
</html>
