<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="../../shared/assets/images/OIP-C.jpg" type="image/jpeg" />
    <title>内容详情 · 欲炼之途</title>
    <link rel="stylesheet" href="./css/content.css" />
  </head>
  <body>
    <div class="wrap narrow">
      <div class="page-top">
        <a href="./index.html" class="back-link">← 返回欲炼之途</a>
        <div class="top-actions">
          <button type="button" class="btn btn-primary sm" id="acceptBtn" style="display:none">接取任务</button>
          <button type="button" class="btn btn-ghost sm" id="copyBtn">🔗 复制链接</button>
        </div>
      </div>

      <article class="detail" id="detailBox">
        <div class="state">
          <div class="spinner"></div>
          <p>加载详情…</p>
        </div>
      </article>
    </div>

    <script type="importmap">
      { "imports": { "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2" } }
    </script>

    <script type="module">
      import { CONTENT_STORE, RISK_COLLAPSED } from './js/content-types.js';
      import { normalizePost, renderDetail } from './js/render.js';
      import { fetchContentList, parseFrontmatter, getToken } from '@/admin/content-manager.js';
      import { getCurrentUser } from '@/shared/js/auth.js';
      import { showLoading, hideLoading } from '@/shared/js/loading.js';
      import { showToast } from '@/shared/js/ui-helpers.js';
      import { acceptTask, myTasks, taskApiReady } from '@/shared/js/task-api.js';

      const box = document.getElementById('detailBox');
      const acceptBtn = document.getElementById('acceptBtn');

      /** 当前内容（接取时需要它的 slug / 标题 / 类型） */
      let currentPost = null;

      // ────────────────────────────────────────── 接取任务
      /**
       * 按内容类型决定是否显示「接取」入口
       * 说明：四种内容里，前三种（玩法任务/主题合集/分级清单）是「可执行」的，
       *       任务反馈（原见解随笔）是提交结果用的，不提供接取。
       */
      const ACCEPTABLE_TYPES = ['task', 'collection', 'checklist'];

      async function setupAcceptButton(post) {
        if (!acceptBtn) return;

        // 后端未配置 / 类型不可接取 → 不显示
        if (!taskApiReady() || !ACCEPTABLE_TYPES.includes(post.type)) {
          acceptBtn.style.display = 'none';
          return;
        }

        const me = await getCurrentUser();
        if (!me) {
          acceptBtn.style.display = 'inline-flex';
          acceptBtn.textContent = '登录后可接取';
          acceptBtn.disabled = true;
          return;
        }

        acceptBtn.style.display = 'inline-flex';

        // 已经接过就直接显示状态，避免重复点击
        const r = await myTasks('all');
        const mine = r.ok ? (r.tasks || []).find((t) => t.task_slug === post.slug) : null;

        if (!mine) {
          acceptBtn.textContent = '✅ 接取任务';
          acceptBtn.disabled = false;
          acceptBtn.dataset.mode = 'accept';
        } else if (mine.status === 'submitted') {
          acceptBtn.textContent = '🎉 已提交反馈';
          acceptBtn.disabled = true;
          acceptBtn.dataset.mode = 'done';
        } else {
          acceptBtn.textContent = '📝 已接取 · 去提交反馈';
          acceptBtn.disabled = false;
          acceptBtn.dataset.mode = 'goto';
        }
      }

      acceptBtn?.addEventListener('click', async () => {
        if (!currentPost) return;
        const mode = acceptBtn.dataset.mode;

        // 已接取 → 引导去发布反馈
        if (mode === 'goto') {
          const url = `./post-editor.html?type=note&task=${encodeURIComponent(currentPost.slug)}`;
          location.href = url;
          return;
        }
        if (mode !== 'accept') return;

        acceptBtn.disabled = true;
        const old = acceptBtn.textContent;
        acceptBtn.textContent = '接取中…';

        const res = await acceptTask({
          slug: currentPost.slug,
          title: currentPost.title,
          type: currentPost.type,
        });

        if (res.ok) {
          showToast(res.already ? '你之前已接取过这个任务' : '已接取，去「我的」可查看进度');
          acceptBtn.textContent = res.already ? '📝 已接取 · 去提交反馈' : '📝 已接取 · 去提交反馈';
          acceptBtn.dataset.mode = 'goto';
          acceptBtn.disabled = false;
        } else {
          showToast('接取失败：' + res.error, 'error');
          acceptBtn.textContent = old;
          acceptBtn.disabled = false;
        }
      });

      function showError(ico, title, desc, action) {
        box.innerHTML = `<div class="state">
          <div class="st-ico">${ico}</div>
          <div class="st-t1">${title}</div>
          <div class="st-t2">${desc || ''}</div>
          ${action || ''}
        </div>`;
      }

      function getSlug() {
        return new URLSearchParams(location.search).get('slug');
      }

      async function load() {
        const slug = getSlug();
        if (!slug) {
          showError('⚠️', '缺少 slug 参数', '请从列表页进入，或检查链接是否完整。',
            '<a href="./index.html" class="btn btn-ghost" style="margin-top:14px">返回列表</a>');
          return;
        }

        showLoading('加载内容', '正在读取…');
        try {
          if (!getToken()) {
            showError('🔑', '未配置 GitHub Token', '内容读取需要 Token。可在 <a href="/admin.html">管理后台</a> 的 Token 设置里填入，或配置环境变量 VITE_GITHUB_TOKEN。',
              '<a href="./index.html" class="btn btn-ghost" style="margin-top:14px">返回列表</a>');
            return;
          }

          const files = await fetchContentList(CONTENT_STORE.branch, CONTENT_STORE.path);
          const target = (files || []).find((f) => f.name.replace(/\.md$/, '') === slug);
          if (!target) {
            showError('🔍', '找不到这篇内容', `未在内容仓库中找到 slug 为「${slug}」的文件。`,
              '<a href="./index.html" class="btn btn-ghost" style="margin-top:14px">返回列表</a>');
            return;
          }

          const res = await fetch(target.download_url + '?t=' + Date.now());
          const raw = await res.text();
          const parsed = parseFrontmatter(raw, target.name);
          const post = normalizePost(target.name, raw, parsed);

          if (!post) {
            showError('⚠️', '内容格式异常', '该文件不是本板块的结构化格式（缺少 JSON 区块）。',
              '<a href="./index.html" class="btn btn-ghost" style="margin-top:14px">返回列表</a>');
            return;
          }

          // 可见性控制
          if (post.visibility !== 'public') {
            const me = await getCurrentUser();
            if (!me) {
              showError('🔐', '这篇内容需要登录后查看', '请先登录再访问。',
                '<a href="/auth.html" class="btn btn-primary" style="margin-top:14px">去登录</a>');
              return;
            }
            if (post.visibility === 'private' && post.meta.authorEmail && post.meta.authorEmail !== me.email) {
              showError('🔒', '这是仅作者本人可见的内容', '你没有查看权限。',
                '<a href="./index.html" class="btn btn-ghost" style="margin-top:14px">返回列表</a>');
              return;
            }
          }

          document.title = post.title + ' · 欲炼之途';
          box.innerHTML = renderDetail(post);
          currentPost = post;

          // 接取入口（按类型与登录状态决定是否显示）
          setupAcceptButton(post);

          // 极高风险折叠展开
          const expandBtn = document.getElementById('expandBtn');
          if (expandBtn) {
            expandBtn.addEventListener('click', () => {
              document.getElementById('collapsedBox').style.display = 'none';
              document.getElementById('bodyBox').style.display = 'block';
            });
          }
        } catch (err) {
          showError('⚠️', '加载失败', err.message,
            '<a href="./index.html" class="btn btn-ghost" style="margin-top:14px">返回列表</a>');
        } finally {
          hideLoading(false);
        }
      }

      document.getElementById('copyBtn').addEventListener('click', async (e) => {
        try {
          await navigator.clipboard.writeText(location.href);
          e.currentTarget.textContent = '✅ 已复制';
        } catch {
          e.currentTarget.textContent = '❌ 复制失败';
        }
        setTimeout(() => { e.currentTarget.textContent = '🔗 复制链接'; }, 1500);
      });

      void RISK_COLLAPSED;
      load();
    </script>
  </body>
</html>
