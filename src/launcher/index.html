<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Foxsir · 欲研所</title>
    <link rel="icon" href="../shared/assets/images/OIP-C.jpg" type="image/jpeg" />
    <!-- ===== R-02 等级样式 ===== -->
    <link rel="stylesheet" href="../shared/css/level.css" />
    <!-- ===== R-05 头像样式 ===== -->
    <link rel="stylesheet" href="../shared/css/avatar.css" />
    <style>
      /* ============================================================
         1. 全局重置 & 基础
         ============================================================ */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background: #0f0e17;
        color: #fffffe;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        /* ===== 全局泛光：新增金色径向渐变 + 原有渐变 ===== */
        background-image:
          radial-gradient(ellipse at 50% 45%, rgba(212, 165, 116, 0.08) 0%, transparent 60%),
          radial-gradient(ellipse at 20% 50%, rgba(212, 165, 116, 0.06) 0%, transparent 60%),
          radial-gradient(ellipse at 80% 20%, rgba(212, 165, 116, 0.04) 0%, transparent 50%),
          radial-gradient(ellipse at 50% 80%, rgba(26, 26, 46, 0.8) 0%, transparent 70%);
        background-attachment: fixed;
      }
      body::before {
        content: '';
        position: fixed;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: radial-gradient(
          circle at 30% 40%,
          rgba(212, 165, 116, 0.03) 0%,
          transparent 60%
        );
        pointer-events: none;
        z-index: 0;
        animation: ambientGlow 20s ease-in-out infinite alternate;
      }
      @keyframes ambientGlow {
        0% {
          transform: translate(0, 0) scale(1);
        }
        100% {
          transform: translate(5%, 3%) scale(1.1);
        }
      }
      .app-container {
        position: relative;
        z-index: 1;
        max-width: 1200px;
        width: 100%;
        margin: 0 auto;
        padding: 32px 40px 48px;
        background: rgba(15, 14, 23, 0.70);
        backdrop-filter: blur(24px) saturate(1.4);
        -webkit-backdrop-filter: blur(24px) saturate(1.4);
        border-radius: 48px;
        border: 1px solid rgba(212, 165, 116, 0.12);
        box-shadow:
          0 0 80px rgba(212, 165, 116, 0.03),
          0 40px 80px rgba(0, 0, 0, 0.6),
          inset 0 1px 0 rgba(255, 255, 255, 0.03);
        transition: box-shadow 0.4s ease;
      }

      /* ============================================================
         2. 顶栏：Logo + 用户信息
         ============================================================ */
      .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding-bottom: 18px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        margin-bottom: 24px;
        flex-wrap: wrap;
        gap: 8px 16px;
      }
      .top-bar .logo-area {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-shrink: 0;
      }
      .top-bar .logo-icon {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        overflow: hidden;
        flex-shrink: 0;
        background: #1a1a2e;
        border: 1px solid rgba(212, 165, 116, 0.15);
        box-shadow: 0 4px 20px rgba(212, 165, 116, 0.1);
      }
      .top-bar .logo-icon img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .top-bar .brand-text h1 {
        font-family: 'Georgia', 'Times New Roman', serif;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 2px;
        background: linear-gradient(135deg, #f5d6a8 0%, #d4a574 60%, #b8946a 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        line-height: 1.2;
      }
      .top-bar .brand-text .tagline {
        font-size: 10px;
        letter-spacing: 2.5px;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.12);
        font-weight: 400;
        -webkit-text-fill-color: rgba(255, 255, 255, 0.12);
      }

      /* ============================================================
         顶栏右侧：用户菜单（类微信右上角）
         收起态仅「头像 + 昵称 + 身份」，点击展开下拉菜单
         ============================================================ */
      .top-bar .user-menu {
        position: relative;
        flex-shrink: 0;
      }

      /* ---- 触发区 ---- */
      .top-bar .user-menu .um-trigger {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 12px 4px 4px;
        border-radius: 40px;
        border: 1px solid rgba(255, 255, 255, 0.05);
        background: rgba(255, 255, 255, 0.02);
        cursor: pointer;
        transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        user-select: none;
        font-family: inherit;
      }
      .top-bar .user-menu .um-trigger:hover,
      .top-bar .user-menu.open .um-trigger {
        background: rgba(212, 165, 116, 0.08);
        border-color: rgba(212, 165, 116, 0.22);
      }

      /* 头像 */
      .top-bar .user-menu .um-avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        overflow: hidden;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #1a1a2e;
        border: 1px solid rgba(212, 165, 116, 0.12);
        position: relative;
      }
      .top-bar .user-menu .um-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .top-bar .user-menu .um-avatar .um-letter {
        font-size: 13px;
        font-weight: 500;
        color: rgba(255, 255, 255, 0.3);
      }
      /* 未登录头像占位 */
      .top-bar .user-menu .um-avatar.is-guest {
        border-style: dashed;
        border-color: rgba(212, 165, 116, 0.25);
      }
      .top-bar .user-menu .um-avatar.is-guest .um-letter {
        font-size: 15px;
        color: rgba(212, 165, 116, 0.5);
      }

      /* 文字区 */
      .top-bar .user-menu .um-text {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 1px;
        line-height: 1.25;
        min-width: 0;
      }
      .top-bar .user-menu .um-name {
        font-size: 13px;
        font-weight: 500;
        color: #fffffe;
        white-space: nowrap;
        max-width: 132px;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .top-bar .user-menu .um-identity {
        font-size: 10px;
        color: rgba(212, 165, 116, 0.75);
        white-space: nowrap;
        max-width: 132px;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .top-bar .user-menu .um-identity.is-empty {
        color: rgba(255, 255, 255, 0.18);
      }

      /* 展开箭头 */
      .top-bar .user-menu .um-caret {
        font-size: 9px;
        color: rgba(255, 255, 255, 0.25);
        transition: transform 0.25s ease;
        margin-left: 2px;
      }
      .top-bar .user-menu.open .um-caret {
        transform: rotate(180deg);
      }

      /* ---- 下拉菜单 ---- */
      .top-bar .user-menu .um-panel {
        position: absolute;
        top: calc(100% + 10px);
        right: 0;
        min-width: 232px;
        background: rgba(20, 18, 28, 0.97);
        backdrop-filter: blur(20px) saturate(1.4);
        -webkit-backdrop-filter: blur(20px) saturate(1.4);
        border: 1px solid rgba(212, 165, 116, 0.14);
        border-radius: 16px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.65);
        padding: 6px;
        z-index: 200;
        opacity: 0;
        visibility: hidden;
        transform: translateY(-8px) scale(0.98);
        transform-origin: top right;
        transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
      }
      .top-bar .user-menu.open .um-panel {
        opacity: 1;
        visibility: visible;
        transform: translateY(0) scale(1);
      }

      .top-bar .user-menu .um-panel-head {
        padding: 12px 14px 10px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        margin-bottom: 6px;
      }
      .top-bar .user-menu .um-panel-head .h-name {
        font-size: 14px;
        font-weight: 600;
        color: #fffffe;
        margin-bottom: 3px;
        word-break: break-all;
      }
      .top-bar .user-menu .um-panel-head .h-sub {
        font-size: 11px;
        color: rgba(255, 255, 255, 0.35);
        word-break: break-all;
      }
      .top-bar .user-menu .um-panel-head .h-ident {
        display: inline-block;
        margin-top: 6px;
        font-size: 10px;
        color: #d4a574;
        background: rgba(212, 165, 116, 0.12);
        border: 1px solid rgba(212, 165, 116, 0.18);
        padding: 1px 9px;
        border-radius: 20px;
      }

      .top-bar .user-menu .um-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 9px 14px;
        border-radius: 10px;
        font-size: 13px;
        color: rgba(255, 255, 255, 0.8);
        cursor: pointer;
        transition: all 0.18s ease;
        text-decoration: none;
        border: none;
        background: transparent;
        width: 100%;
        text-align: left;
        font-family: inherit;
      }
      .top-bar .user-menu .um-item:hover {
        background: rgba(212, 165, 116, 0.1);
        color: #fffffe;
      }
      .top-bar .user-menu .um-item .um-ico {
        font-size: 14px;
        width: 18px;
        text-align: center;
        flex-shrink: 0;
      }
      .top-bar .user-menu .um-item.is-danger {
        color: #f87171;
      }
      .top-bar .user-menu .um-item.is-danger:hover {
        background: rgba(239, 68, 68, 0.12);
        color: #fca5a5;
      }
      .top-bar .user-menu .um-divider {
        height: 1px;
        background: rgba(255, 255, 255, 0.05);
        margin: 5px 8px;
      }
      .top-bar .user-menu .um-tip {
        padding: 8px 14px 10px;
        font-size: 11px;
        color: rgba(255, 255, 255, 0.25);
        line-height: 1.5;
      }

      @media (max-width: 480px) {
        .top-bar .user-menu .um-name,
        .top-bar .user-menu .um-identity {
          max-width: 76px;
        }
        .top-bar .user-menu .um-panel {
          min-width: 200px;
        }
      }

      /* ============================================================
         3. 欢迎卡片 —— 左侧文字 + 右侧图片（渐变过渡）
         ============================================================ */
      .welcome-card {
        display: flex;
        flex-direction: row;
        border-radius: 24px;
        overflow: hidden;
        margin-bottom: 32px;
        min-height: 180px;
        background: rgba(15, 14, 23, 0.65);
        border: 1px solid rgba(255, 255, 255, 0.05);
        transition: border-color 0.3s ease, box-shadow 0.3s ease;
      }
      .welcome-card:hover {
        border-color: rgba(212, 165, 116, 0.10);
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      }

      /* 左栏：文字 */
      .welcome-card .welcome-text {
        flex: 1.2;
        padding: 44px 48px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        background: transparent;
      }
      .welcome-card .welcome-text .greeting {
        font-size: 22px;
        font-weight: 600;
        color: #e8e0d8;
        margin-bottom: 6px;
        letter-spacing: 0.5px;
      }
      .welcome-card .welcome-text .greeting .highlight {
        color: #d4a574;
      }
      .welcome-card .welcome-text .desc {
        font-size: 16px;
        color: rgba(255, 255, 255, 0.80);
        line-height: 1.7;
        max-width: 520px;
        margin-bottom: 18px;
      }
      .welcome-card .welcome-text .btn-about {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 10px 28px;
        border-radius: 40px;
        background: rgba(212, 165, 116, 0.10);
        color: #d4a574;
        border: 1px solid rgba(212, 165, 116, 0.12);
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
        transition: all 0.3s ease;
        font-family: inherit;
        cursor: pointer;
        align-self: flex-start;
      }
      .welcome-card .welcome-text .btn-about:hover {
        background: rgba(212, 165, 116, 0.18);
        border-color: rgba(212, 165, 116, 0.25);
        transform: translateY(-2px);
        box-shadow: 0 8px 28px rgba(212, 165, 116, 0.08);
      }
      .welcome-card .welcome-text .btn-about .arrow {
        display: inline-block;
        transition: transform 0.3s ease;
      }
      .welcome-card .welcome-text .btn-about:hover .arrow {
        transform: translateX(5px);
      }

      /* 右栏：图片 + 渐变遮罩（从左到右融合） */
      .welcome-card .welcome-image {
        flex: 1;
        background-image:
          linear-gradient(to right, rgba(15, 14, 23, 0.85) 0%, transparent 45%, transparent 100%),
          url('../shared/assets/images/OIP-B.jpg');
        background-size: 100% 100%, cover;
        background-position: center;
        background-repeat: no-repeat;
        min-height: 180px;
        transition: filter 0.3s ease;
      }
      .welcome-card:hover .welcome-image {
        filter: brightness(1.02) saturate(1.02);
      }

      /* ============================================================
         4. 项目探索
         ============================================================ */
      .projects-section {
        margin-top: 6px;
      }
      .projects-section-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 18px;
        flex-wrap: wrap;
        gap: 8px;
      }
      .projects-section-header::before,
      .projects-section-header::after {
        content: "◆";
        color: rgba(212, 165, 116, 0.35);
        font-size: 14px;
      }
      .projects-section-header h2 {
        font-family: 'Georgia', 'Times New Roman', serif;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 1px;
        color: #fffffe;
      }
      .projects-section-header .subtitle {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.15);
        letter-spacing: 1px;
      }

      /* PC 三列卡片 */
      .project-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
      }
      .project-card {
        background: rgba(255, 255, 255, 0.02);
        border-radius: 18px;
        padding: 22px 18px 18px;
        border: 1px solid rgba(255, 255, 255, 0.04);
        transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        position: relative;
        overflow: hidden;
        text-decoration: none;
        color: inherit;
      }
      .project-card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: linear-gradient(135deg, rgba(212, 165, 116, 0.03), transparent 60%);
        opacity: 0;
        transition: opacity 0.4s ease;
        pointer-events: none;
      }
      .project-card:hover {
        transform: translateY(-4px);
        border-color: rgba(212, 165, 116, 0.12);
        background: rgba(255, 255, 255, 0.04);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
      }
      .project-card:hover::before {
        opacity: 1;
      }
      .project-card .icon-wrap {
        font-size: 26px;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 44px;
        height: 44px;
        border-radius: 14px;
        background: rgba(212, 165, 116, 0.06);
        border: 1px solid rgba(212, 165, 116, 0.04);
        flex-shrink: 0;
      }
      .project-card h3 {
        font-size: 15px;
        font-weight: 500;
        color: #fffffe;
        margin: 0 0 2px;
        letter-spacing: 0.3px;
      }
      .project-card p {
        font-size: 12px;
        color: rgba(255, 255, 255, 0.25);
        line-height: 1.5;
        margin: 0 0 12px;
        flex: 1;
      }
      .project-card .enter-hint {
        font-size: 11px;
        color: #d4a574;
        display: flex;
        align-items: center;
        gap: 4px;
        transition: color 0.3s ease;
        margin-top: auto;
      }
      .project-card:hover .enter-hint {
        color: rgba(212, 165, 116, 0.8);
      }
      .project-card .enter-hint::after {
        content: '→';
        transition: transform 0.3s ease;
      }
      .project-card:hover .enter-hint::after {
        transform: translateX(4px);
      }
      .project-card .status-tag {
        position: absolute;
        top: 14px;
        right: 14px;
        font-size: 9px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        padding: 1px 8px;
        border-radius: 20px;
        background: rgba(255, 255, 255, 0.04);
        color: rgba(255, 255, 255, 0.1);
      }
      .project-card .status-tag.maintenance {
        background: rgba(245, 158, 11, 0.1);
        color: #f59e0b;
      }
      .project-card .status-tag.offline {
        background: rgba(239, 68, 68, 0.06);
        color: #ef4444;
      }
      .project-card.disabled {
        opacity: 0.4;
        cursor: not-allowed;
        pointer-events: none;
      }
      .project-card.disabled:hover {
        transform: none;
        border-color: rgba(255, 255, 255, 0.04);
        background: rgba(255, 255, 255, 0.02);
      }

      /* ============================================================
         5. 页脚
         ============================================================ */
      .footer {
        margin-top: 36px;
        padding-top: 18px;
        border-top: 1px solid rgba(255, 255, 255, 0.04);
        text-align: center;
        font-size: 11px;
        color: rgba(212, 165, 116, 0.4);
        letter-spacing: 0.5px;
      }
      .footer span {
        color: rgba(212, 165, 116, 0.6);
      }

      /* ============================================================
         6. Toast
         ============================================================ */
      .toast-container {
        position: fixed;
        bottom: 30px;
        right: 30px;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        gap: 10px;
        max-width: 360px;
        width: 100%;
      }
      .toast {
        padding: 12px 20px;
        border-radius: 14px;
        background: rgba(15, 14, 23, 0.9);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.06);
        color: #fffffe;
        font-size: 13px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
        animation: toastIn 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        transform-origin: bottom right;
      }
      .toast.error {
        border-color: rgba(239, 68, 68, 0.15);
      }
      .toast.error .toast-icon {
        color: #f87171;
      }
      .toast.success {
        border-color: rgba(34, 197, 94, 0.15);
      }
      .toast.success .toast-icon {
        color: #22c55e;
      }
      @keyframes toastIn {
        from { opacity: 0; transform: translateY(20px) scale(0.95); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      .toast-out {
        animation: toastOut 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      @keyframes toastOut {
        from { opacity: 1; transform: translateY(0) scale(1); }
        to { opacity: 0; transform: translateY(20px) scale(0.95); }
      }

      /* ============================================================
         7. 滚动条
         ============================================================ */
      ::-webkit-scrollbar {
        width: 4px;
      }
      ::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.02);
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(212, 165, 116, 0.15);
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: rgba(212, 165, 116, 0.25);
      }

      /* ============================================================
         8. 响应式 · 平板 820px（保持左右结构）
         ============================================================ */
      @media (max-width: 820px) {
        .top-bar {
          flex-direction: column;
          align-items: stretch;
          gap: 8px;
          padding-bottom: 14px;
        }
        .top-bar .user-menu {
          align-self: flex-end;
        }
        .top-bar .user-menu .um-panel {
          right: 0;
        }

        .welcome-card {
          flex-direction: row !important;
          min-height: auto;
          border-radius: 20px;
        }
        .welcome-card .welcome-text {
          padding: 28px 30px;
          flex: 1.2;
        }
        .welcome-card .welcome-text .greeting {
          font-size: 20px;
        }
        .welcome-card .welcome-text .desc {
          font-size: 15px;
          max-width: 100%;
        }
        .welcome-card .welcome-image {
          flex: 1;
          min-height: 160px;
          background-image:
            linear-gradient(to right, rgba(15, 14, 23, 0.80) 0%, transparent 40%, transparent 100%),
            url('../shared/assets/images/OIP-B.jpg');
          background-size: 100% 100%, cover;
          background-position: center;
          border-radius: 0;
        }

        .project-grid {
          grid-template-columns: repeat(2, 1fr);
          gap: 10px;
        }
        .project-card {
          padding: 16px 14px 14px;
        }
        .project-card .icon-wrap {
          width: 36px;
          height: 36px;
          font-size: 22px;
        }
      }

      /* ============================================================
         9. 响应式 · 手机 ≤480px（左右结构 + 紧凑适配）
         ============================================================ */
      @media (max-width: 480px) {
        .app-container {
          padding: 14px;
          border-radius: 24px;
        }
        .top-bar .brand-text h1 {
          font-size: 20px;
        }
        .top-bar .logo-icon {
          width: 38px;
          height: 38px;
        }
        .top-bar .user-menu .um-avatar {
          width: 28px;
          height: 28px;
        }
        .top-bar .user-menu .um-avatar .um-letter {
          font-size: 12px;

      /* ============================================================
      任务直达 —— 已接取未完成的任务
      位置：模块入口下方
      显隐：由 renderMissions() 控制（未登录 / 无数据 / 后端未配置 → 整块隐藏）
      ============================================================ */
      .missions-section {
        max-width: 1100px;
        margin: 0 auto 48px;
        padding: 0 24px;

      .ms-head {
        display: flex;

      <!-- ============================================================

    <!-- ============================================================

    <!-- ============================================================
    Import Map & 主脚本
    ============================================================ -->
    <script type="importmap">
      {
        "imports": {
          "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@2"
        }
      }
    </script>

    <script type="module">
      // ===== 核心模块导入 =====
      import { signOut, getCurrentUser, getUserIdentity, getCachedUser } from '@/shared/js/auth.js';
      import { getUserRole } from '@/shared/js/identity.js';
      import { getVisibleProjects } from '@/shared/js/registry.js';
      import { getRoleTitle } from '@/shared/js/level.js';
      import { myTasks, taskApiReady } from '@/shared/js/task-api.js';

      const topUserInfo = document.getElementById('topUserInfo');
      const projectGrid = document.getElementById('projectGrid');
      const toastContainer = document.getElementById('toastContainer');

      const ROLE_MAP = {
        guest: '访客',
        self: '普通用户',
        verified: '认证用户',
        subadmin: '次级管理',
        admin: '根源管理',
      };

      function showToast(message, type = 'info') {
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        toast.innerHTML = `<span class="toast-icon">${type === 'error' ? '✕' : '✓'}</span> ${message}`;
        toastContainer.appendChild(toast);
        setTimeout(() => {
          toast.classList.add('toast-out');
          setTimeout(() => toast.remove(), 300);
        }, 2800);
      }

      function getDisplayName(user) {
        if (!user) return null;
        const nickname = user.user_metadata?.nickname;
        if (nickname && nickname.trim()) return nickname.trim();
        return user.email;
      }

      function getAvatarLetter(user) {
        const name = getDisplayName(user);
        if (!name) return '👤';
        const first = name.charAt(0).toUpperCase();
        if (/[A-Za-z]/.test(first)) return first;
        return '👤';
      }

      function isMobileScreen() {
        return window.innerWidth <= 480;
      }

      // ============================================================
      // 渲染顶栏用户菜单（类微信右上角）
      //   收起态：头像 + 昵称 + 身份
      //   点击展开：我的 / 管理面板（管理员）/ 登出
//   注：原「个人资料」入口已取消 —— 资料页是编辑表单而非浏览页，
//       入口统一放在「我的」页面顶部的「编辑资料」按钮。
      //   未登录：头像占位 + 注册入口
      // ============================================================

      /** 组装身份显示文案：主身份标签（如「男S」），无主身份返回空串 */
      function buildIdentityText(identity) {
        if (!identity) return '';
        return identity.primaryLabel || '';
      }

      /** 主身份标签 + 角色称谓，如「男S · 主」 */
      function buildIdentityLine(identity, user) {
        const label = buildIdentityText(identity);
        if (!label) return '';
        if (identity?.primaryId) {
          const role = getRoleTitle(identity.primaryId);
          return role ? `${label} · ${role}` : label;
        }
        return label;
      }

      async function renderTopUser(user, ctx) {
        // 会话 / 角色 / 身份均由 renderAll 预先并行取好后传入，
        // 避免在这里串行等待三次网络往返（实测会让导航栏比卡片晚 600ms 以上）。
        const me = user !== undefined ? user : await getCurrentUser();
        const u = me;

        // ───────── 未登录：头像占位 + 注册入口 ─────────
        if (!u) {
          topUserInfo.innerHTML = `
            <div class="um-trigger" id="umTrigger" role="button" tabindex="0" aria-haspopup="menu" aria-expanded="false">
              <div class="um-avatar is-guest"><span class="um-letter">👤</span></div>
              <div class="um-text">
                <span class="um-name">未登录</span>
                <span class="um-identity is-empty">点此注册 / 登录</span>
              </div>
              <span class="um-caret">▼</span>
            </div>
            <div class="um-panel" id="umPanel" role="menu">
              <div class="um-panel-head">
                <div class="h-name">游客模式</div>
                <div class="h-sub">注册后可设置头像与昵称</div>
              </div>
              <a href="/auth.html" class="um-item" role="menuitem">
                <span class="um-ico">🌿</span> 注册 / 登录
              </a>
              <a href="/about.html" class="um-item" role="menuitem">
                <span class="um-ico">📖</span> 了解规则
              </a>
              <div class="um-divider"></div>
              <a href="/landing.html" class="um-item" role="menuitem">
                <span class="um-ico">🚪</span> 返回引导页
              </a>
              <div class="um-tip">当前为游客浏览，部分内容与操作受限</div>
            </div>
          `;
          wireUserMenu();
          return;
        }

        // ───────── 已登录 ─────────
        const identity = ctx && ctx.identity !== undefined ? ctx.identity : await getUserIdentity();
        const role = ctx && ctx.role !== undefined ? ctx.role : await getUserRole();
        const displayName = getDisplayName(u);
        const avatarUrl = identity?.avatarUrl || null;
        const avatarLetter = getAvatarLetter(u);
        const identityText = buildIdentityText(identity);
        const identityLine = buildIdentityLine(identity, u);
        const roleLabel = ROLE_MAP[role] || role;

        const avatarHtml = avatarUrl
          ? `<img src="${avatarUrl}" alt="${displayName}" />`
          : `<span class="um-letter">${avatarLetter}</span>`;

        const isAdmin = ['admin', 'subadmin'].includes(role);
        const adminItem = isAdmin
          ? `<a href="/admin.html" class="um-item" role="menuitem">
               <span class="um-ico">⚙️</span> 管理面板
             </a>`
          : '';

        const identityBadge = identityLine
          ? `<span class="h-ident">${identityLine}</span>`
          : `<span class="h-ident" style="color:rgba(255,255,255,0.3);background:rgba(255,255,255,0.04);border-color:rgba(255,255,255,0.06);">未设置身份</span>`;

        topUserInfo.innerHTML = `
          <div class="um-trigger" id="umTrigger" role="button" tabindex="0" aria-haspopup="menu" aria-expanded="false" title="个人菜单">
            <div class="um-avatar">${avatarHtml}</div>
            <div class="um-text">
              <span class="um-name">${displayName}</span>
              <span class="um-identity${identityLine ? '' : ' is-empty'}">${identityLine || '未设置身份'}</span>
            </div>
            <span class="um-caret">▼</span>
          </div>
          <div class="um-panel" id="umPanel" role="menu">
            <div class="um-panel-head">
              <div class="h-name">${displayName}</div>
              <div class="h-sub">${u.email || ''}</div>
              <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;">${identityBadge}
                <span class="h-ident" style="color:rgba(255,255,255,0.4);background:rgba(255,255,255,0.04);border-color:rgba(255,255,255,0.06);">${roleLabel}</span>
              </div>
            </div>
            <a href="/my.html" class="um-item" role="menuitem">
              <span class="um-ico">🗂️</span> 我的
            </a>
            ${adminItem}
            <div class="um-divider"></div>
            <button type="button" class="um-item is-danger" id="umLogoutBtn" role="menuitem">
              <span class="um-ico">🚪</span> 退出登录
            </button>
          </div>
        `;

        wireUserMenu();

        document.getElementById('umLogoutBtn')?.addEventListener('click', async () => {
          closeUserMenu();
          await signOut();
        });
      }

      // ───────── 任务直达（已接取未完成）─────────
      // 只在「已登录 + 后端已配置 + 确实有未完成任务」时显示，
      // 否则整块隐藏 —— 首页对游客保持干净。
      //
      // ★ 两段式渲染（与导航栏同思路）：
      //   任务列表必须问服务器，一次往返实测约 900ms。若等它，
      //   用户会看到导航栏和卡片都出来了、任务直达却空一拍。
      //   故：先用上次的缓存结果立刻画出来，网络回来后再覆盖。
      //   缓存只用来"先画"，不作为真实状态依据。
      const MISSIONS_CACHE_KEY = 'foxsir_missions_cache';

      function readMissionsCache() {
        try {
          const raw = localStorage.getItem(MISSIONS_CACHE_KEY);
          if (!raw) return null;
          const j = JSON.parse(raw);
          return Array.isArray(j.tasks) ? j.tasks : null;
        } catch { return null; }
      }

      function writeMissionsCache(tasks) {
        try {
          localStorage.setItem(MISSIONS_CACHE_KEY, JSON.stringify({ tasks, at: Date.now() }));
        } catch { /* 存不下就算了，不影响功能 */ }
      }

      /** 渲染任务直达列表；tasks 为空则整块隐藏 */
      function paintMissions(tasks) {
        const section = document.getElementById('missionsSection');
        const listEl = document.getElementById('missionsList');
        if (!section || !listEl) return;
        if (!tasks || !tasks.length) return;

        listEl.innerHTML = tasks.slice(0, 5).map((t) => {
          const url = `/modules/content/post.html?slug=${encodeURIComponent(t.task_slug)}`;
          const when = (t.accepted_at || '').slice(0, 10);
          return `
            <a class="ms-item" href="${url}">
              <span class="ms-ico">⛓️</span>
              <span class="ms-body">
                <span class="ms-name">${escapeHtml(t.task_title || t.task_slug)}</span>
                <span class="ms-meta">接取于 ${when}</span>
              </span>
              <span class="ms-go">提交 →</span>
            </a>`;
        }).join('');
        section.hidden = false;
      }

      /** 防止任务直达并发拉取两次（首屏与校正各会触发一次） */
      let missionsInFlight = null;

      async function renderMissions(user) {
        const section = document.getElementById('missionsSection');
        const listEl = document.getElementById('missionsList');
        if (!section || !listEl) return;

        if (!taskApiReady()) return;              // 后端未配置 → 不显示

        // 已有请求在飞就复用它，避免重复往返
        if (missionsInFlight) return missionsInFlight;

        missionsInFlight = (async () => {
          // 复用调用方已查到的用户，避免重复请求
          const me = user !== undefined ? user : await getCurrentUser();
          if (!me) return;                        // 游客 → 不显示

          // ① 先用缓存立即画出（未登录时不会走到这里）
          const cached = readMissionsCache();
          if (cached && cached.length) paintMissions(cached);

          // ② 再取真实数据覆盖
          const r = await myTasks('accepted');    // 只取未完成的
          if (!r.ok) return;                      // 失败就保留缓存画面，不动

          const tasks = r.tasks || [];
          if (tasks.length) {
            writeMissionsCache(tasks);
            paintMissions(tasks);
          } else {
            // 已无未完成任务：清缓存并隐藏
            try { localStorage.removeItem(MISSIONS_CACHE_KEY); } catch {}
            section.hidden = true;
            listEl.innerHTML = '';
          }
        })().finally(() => { missionsInFlight = null; });

        return missionsInFlight;
      }

      function escapeHtml(s) {
        return String(s ?? '')
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
      }

      // ───────── 用户菜单交互 ─────────
      // topUserInfo 本身就是 .user-menu（见 .top-bar 内的结构），open 类直接加在它上面
      function openUserMenu() {
        topUserInfo.classList.add('open');
        topUserInfo.querySelector('.um-trigger')?.setAttribute('aria-expanded', 'true');
      }
      function closeUserMenu() {
        topUserInfo.classList.remove('open');
        topUserInfo.querySelector('.um-trigger')?.setAttribute('aria-expanded', 'false');
      }
      function toggleUserMenu() {
        if (topUserInfo.classList.contains('open')) closeUserMenu();
        else openUserMenu();
      }

      // 全局关闭逻辑只需注册一次；而每次重渲染都会生成新的 #umTrigger，
      // 因此用 data 标记避免对同一元素重复绑定。
      let umGlobalWired = false;
      function wireUserMenu() {
        const trigger = topUserInfo.querySelector('#umTrigger');
        if (!trigger || trigger.dataset.wired === '1') return;
        trigger.dataset.wired = '1';

        // 触发区点击/键盘
        trigger.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleUserMenu();
        });
        trigger.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            toggleUserMenu();
          }
        });

        // 全局关闭逻辑仅注册一次
        if (umGlobalWired) return;
        umGlobalWired = true;

        document.addEventListener('click', (e) => {
          if (!topUserInfo.contains(e.target)) closeUserMenu();
        });
        document.addEventListener('keydown', (e) => {
          if (e.key === 'Escape') closeUserMenu();
        });
        window.addEventListener('resize', closeUserMenu);
      }

      // ============================================================
      // 渲染项目
      // ============================================================
      async function renderProjects(role) {
        // 传入 role 可省去 getUserRole() 内部的一次网络校验（getCurrentUser）。
        // 首屏由 renderAll 用缓存角色先渲染一次，网络结果回来后再覆盖，
        // 否则模块卡片要白等 1~2 秒才出现。
        const r = role !== undefined ? role : await getUserRole();
        const visible = getVisibleProjects(r);
        const mobile = isMobileScreen();

        if (visible.length === 0) {
          projectGrid.innerHTML = `<p style="color:rgba(255,255,255,0.2);grid-column:1/-1;text-align:center;padding:40px 0;">暂无可用项目</p>`;
          return;
        }

        if (mobile) {
          projectGrid.innerHTML = visible.map(project => {
            const statusClass = project.status === 'maintenance' ? 'maintenance' : '';
            const disabled = project.status === 'offline' || project.status === 'maintenance';
            return `
              <a href="${project.url}" class="project-card ${disabled ? 'disabled' : ''}">
                ${project.status === 'maintenance' ? `<span class="status-tag ${statusClass}">维护中</span>` : ''}
                <div class="icon-wrap">${project.icon || '📦'}</div>
                <div class="text-group">
                  <h3>${project.name}</h3>
                  <p>${project.description}</p>
                </div>
                <span class="enter-hint">${disabled ? '暂不可用' : '>'}</span>
              </a>
            `;
          }).join('');
        } else {
          projectGrid.innerHTML = visible.map(project => {
            const statusClass = project.status === 'maintenance' ? 'maintenance' : '';
            const disabled = project.status === 'offline' || project.status === 'maintenance';
            return `
              <a href="${project.url}" class="project-card ${disabled ? 'disabled' : ''}">
                <span class="status-tag ${statusClass}">${project.status === 'maintenance' ? '维护中' : ''}</span>
                <div class="icon-wrap">${project.icon || '📦'}</div>
                <h3>${project.name}</h3>
                <p>${project.description}</p>
                <span class="enter-hint">${disabled ? '暂不可用' : '进入'}</span>
              </a>
            `;
          }).join('');
        }
      }

      // ============================================================
      // 渲染全部（带超时兜底）
      // ============================================================
      //
      // ★ 三段内容必须同时开始，不能串行：
      //   顶部导航栏、模块卡片、任务直达 —— 任何一段排在 await 之后，
      //   都会让用户明显看到"导航栏先空着，过一会儿才补上"。
      //   故这里只查一次登录会话，然后三件事并行；会话查询失败也不
      //   影响其余两段（各自有兜底）。
      async function renderAll() {
        // ── 第一步：用本地缓存立刻画出「导航栏 + 模块卡片 + 任务直达」 ──
        // 这三块都只需要缓存里就有的信息，不必等网络。
        // 之前它们都排在 getCurrentUser() 之后，导致首屏有 1~2 秒空白。
        const cached = getCachedUser();
        const cachedRole = cached ? (cached.user_metadata?.role || 'self') : 'guest';

        renderTopUser(cached, {
          role: cachedRole,
          identity: cached ? identityFromUser(cached) : null,
        }).catch(() => {});
        renderProjects(cachedRole).catch(() => {});

        // 任务直达：有缓存用户就立刻用缓存列表画出来，
        // 否则等下面的网络结果（renderMissions 内部会再调一次，属幂等）
        if (cached) {
          const cachedTasks = readMissionsCache();
          if (cachedTasks && cachedTasks.length) {
            paintMissions(cachedTasks);
          } else {
            renderMissions(cached).catch(() => {});
          }
        }

        // ── 第二步：并行取齐会话/角色/身份 ──
        // 一次并行只花最长的那次往返，供最终校正使用。
        let user = null, role = null, identity = null;
        try {
          [user, role, identity] = await Promise.all([
            getCurrentUser(),
            getUserRole().catch(() => null),
            getUserIdentity().catch(() => null),
          ]);
        } catch { /* 会话查询失败按未登录处理 */ }

        // ── 第三步：用校验后的真实身份覆盖，并刷新任务直达 ──
        const ctx = { role, identity };
        try {
          await Promise.race([
            Promise.all([
              renderTopUser(user, ctx),
              renderProjects(role),
              // 任务直达失败或超时都不影响首页其余部分
              renderMissions(user).catch((e) => console.warn('任务直达渲染失败:', e)),
            ]),
            new Promise((_, reject) => setTimeout(() => reject(new Error('数据加载超时')), 8000)),
          ]);
        } catch (err) {
          console.warn('renderAll 超时或失败:', err);
          // 不阻塞界面，已渲染的部分保留
        }
      }

      /** 从用户对象直接取身份信息（纯本地，零网络） */
      function identityFromUser(user) {
        const m = (user && user.user_metadata) || {};
        return {
          primaryId: m.primary_identity || null,
          primaryLabel: m.primary_label || null,
          gender: m.gender || null,
          roleType: m.role_type || null,
          nickname: m.nickname || (user.email || '').split('@')[0] || '访客',
          role: m.role || 'self',
          points: m.points ?? 0,
          avatarUrl: m.avatar_url || null,
        };
      }

      window.addEventListener('resize', () => renderProjects());

      import { onAuthStateChange } from '@/shared/js/auth.js';
      onAuthStateChange(() => renderAll());

      renderAll();
      window.showToast = showToast;
    </script>
  </body>
</html>
